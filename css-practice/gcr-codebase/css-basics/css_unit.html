  <!-- Combinator ka use HTML elements ke relationship ke according CSS lagane ke liye hota hai.

Main 4 combinators hain:

→ Descendant
> → Child
+ → Adjacent Sibling
~ → General Sibling -->
<!-- 1. Descendant Combinator — space -->
<div>
    <p>Hello</p>
    <section>
        <p>World</p>
    </section>
</div>
<!-- child combinators -->
<div>
    <p>Hello</p>
    <section>
        <p>World</p>
    </section>
</div>

<!-- Adjacent Sibling — + -->

HTML:

<h1>Heading</h1>
<p>Hello</p>
<p>World</p>



<!-- 4. General Sibling — ~ -->

HTML:

<h1>Heading</h1>
<p>Hello</p>
<p>World</p>


<!-- pseudo class -->
 <button>Click Me</button>

 <input type="text">

 <div>
    <p>One</p>
    <p>Two</p>
    <p>Three</p>
</div>
