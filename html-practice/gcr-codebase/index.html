<!DOCTYPE html>
<!-- Browser ko batata hai ki ye HTML5 document hai -->

<html lang="en">
<!-- HTML document ki starting.
     lang="en" ka matlab page ki language English hai -->

<head>
    <!-- Head section me page ki information hoti hai.
         Ye browser ke liye hoti hai, user ko directly nahi dikhti. -->

    <meta charset="UTF-8">
    <!-- UTF-8 character encoding use karta hai.
         Isse English, Hindi aur special characters sahi display hote hain. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive design ke liye.
         Mobile aur desktop dono me page sahi size me dikhe. -->

    <title>Document</title>
    <!-- Browser ke tab me jo naam dikhai deta hai wo yaha likhte hain.
         Example: Document -->
</head>

<body>
    <!-- Body section me wo sab content aata hai jo user webpage par dekhta hai. -->

    <!-- ❌ Galat Tag -->
    <!-- <tittle> Alok.AI</tittle> -->

    <!-- ✅ Agar browser tab ka naam "Alok.AI" rakhna hai to
         <title>Alok.AI</title> ko <head> ke andar likho. -->

    <!-- ✅ Agar webpage par "Alok.AI" dikhana hai to heading use karo -->
    <h1>Alok.AI</h1>
    <!-- h1 sabse badi heading hoti hai. -->

</body>
<!-- Body section yaha khatam hota hai. -->

</html>
<!-- HTML document yaha end hota hai. -->
