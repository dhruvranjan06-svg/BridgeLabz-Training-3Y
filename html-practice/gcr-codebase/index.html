<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
         .box7{
            width: 50px;
            height: 50px;

            padding: 20px;
            margin: 10px;

            border: 2px solid #ccc;
            border-radius: 15px;

        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            color: #222;
        }
       


        /* HEADER */

        header {
            width: 100%;
            height: 80px;
            background-color: #222;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        header h1 {
            color: white;
            font-size: 32px;
        }

        /* MAIN */

        main {
            min-height: 600px;
            padding: 50px 20px;
        }

        /* CONTAINER */

        .container {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 30px;
            flex-wrap: wrap;
        }

        /* BOX */

        .box {
            width: 250px;
            height: 250px;

            padding: 20px;
            margin: 10px;

            border: 2px solid #ccc;
            border-radius: 15px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .box1 {
            background-color: #ffe5e5;
        }

        .box2 {
            background-color: #fff5cc;
        }

        .box3 {
            background-color: #e5ffe5;
        }

        .box4 {
            background-color: #e5f0ff;
        }

        /* CIRCLE */

        .circle {
            width: 90px;
            height: 90px;

            border-radius: 50%;
            margin-bottom: 15px;
        }

        .red {
            background-color: red;
        }

        .yellow {
            background-color: yellow;
        }

        .green {
            background-color: green;
        }

        .blue {
            background-color: blue;
        }

        /* TEXT */

        .box h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .box p {
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* BUTTON */

        button {
            padding: 10px 20px;

            background-color: #222;
            color: white;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        /* FOOTER */

        footer {
            width: 100%;
            height: 70px;

            background-color: #222;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .box {
                width: 90%;
            }

            header h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>
        <h1>My Website</h1>
        <div class="box box7">
                <div class="circle blue"></div>
                <!-- <h3>Blue Circle</h3>
                <p>This is a blue circle.</p>
                <button>Explore</button> -->

        </div>
    </header>


    <!-- MAIN -->

    <main>

        <div class="container">

            <div class="box box1">
                <div class="circle red"></div>
                <h3>Red Circle</h3>
                <p>This is a red circle.</p>
                <button>Explore</button>
            </div>

            <div class="box box2">
                <div class="circle yellow"></div>
                <h3>Yellow Circle</h3>
                <p>This is a yellow circle.</p>
                <button>Explore</button>
            </div>

            <div class="box box3">
                <div class="circle green"></div>
                <h3>Green Circle</h3>
                <p>This is a green circle.</p>
                <button>Explore</button>
            </div>

            <div class="box box4">
                <div class="circle blue"></div>
                <h3>Blue Circle</h3>
                <p>This is a blue circle.</p>
                <button>Explore</button>
            </div>

            

    </main>


    <!-- FOOTER -->

    <footer>
        <p>© 2026 My Website | HTML & CSS Practice</p>
    </footer>

</body>

</html>
